<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BWebTunnel — 404</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-card notfound-card">
    <div class="notfound-glow" aria-hidden="true"></div>

    <div class="notfound-code">
        <span class="digit">4</span>
        <span class="digit digit-zero">
            <span class="zero-ring"></span>
            <span class="zero-core"></span>
        </span>
        <span class="digit">4</span>
    </div>

    <h1 class="notfound-title">туннель не найден</h1>
    <p class="notfound-text">
        По этому адресу ничего нет — возможно, ссылка устарела<br>
        или токен был отозван.
    </p>

    <div class="notfound-actions">
        <a href="/" class="btn btn-login">на главную</a>
        <a href="/dashboard.html" class="btn btn-register">в дашборд</a>
    </div>

    <div class="footer-note">
        <span class="status">
            <span class="dot"></span>
            <span>connection idle</span>
        </span>
    </div>
</div>
</body>
</html>
